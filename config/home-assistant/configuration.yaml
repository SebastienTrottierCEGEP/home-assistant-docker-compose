
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_boolean:
  pere_noel_dans_ma_maison:
    name: Père Noël dans ma maison
    icon: mdi:string-lights
    initial: false

  je_suis_a_la_maison:
    name: Je suis à la maison

  exercice_15_capteur_virtuel:
    name: Exercice 15 - Capteur / Récepteur virtuel
    icon: mdi:toggle-switch
    initial: false

  exercice_18_stores:
    name: Exercice 18 - Stores
    icon: mdi:blinds
    initial: true

  exercice_18_cafetiere:
    name: Exercice 18 - Cafetière
    icon: mdi:coffee-maker
    initial: false

  exercice_18_lumiere_chambre:
    name: Exercice 18 - Lumière de la chambre
    icon: mdi:lightbulb
    initial: false

  exercice_18_lumiere_cuisine:
    name: Exercice 18 - Lumière de la cuisine
    icon: mdi:lightbulb
    initial: false

  exercice_18_declencheur_mouvement_cuisine:
    name: Exercice 18 - Détecteur de mouvement (cuisine)
    icon: mdi:motion-sensor
    initial: false

input_button:
  exercice_15_declencheur_manuel:
    name: Exercice 15 - Déclencheur manuel
    icon: mdi:gesture-tap-button

input_text:
  texte_examen:
    name: Texte examen
    max: 255

input_datetime:
  date_examen:
    name: Date examen
    has_date: true
    has_time: false

  exercice_18_heure_reveil:
    name: Exercice 18 - Heure de réveil
    has_date: false
    has_time: true
    icon: mdi:alarm

  exercice_18_heure_depart:
    name: Exercice 18 - Heure de départ (école / travail)
    has_date: false
    has_time: true
    icon: mdi:briefcase-outline

  exercice_18_heure_retour:
    name: Exercice 18 - Heure de retour
    has_date: false
    has_time: true
    icon: mdi:home-import-outline

  exercice_18_heure_coucher:
    name: Exercice 18 - Heure de coucher
    has_date: false
    has_time: true
    icon: mdi:bed

input_number:
  exercice_18_temperature_virtuelle:
    name: Exercice 18 - Température virtuelle
    min: -30
    max: 50
    step: 0.1
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer

template:
  - binary_sensor:
      - name: Exercice 18 - Endormi
        unique_id: exercice_18_endormi
        icon: mdi:sleep
        # Le coucher étant toujours avant minuit, la nuit chevauche le passage à minuit.
        state: >-
          {% set coucher = states('input_datetime.exercice_18_heure_coucher') %}
          {% set reveil = states('input_datetime.exercice_18_heure_reveil') %}
          {% set now_t = now().strftime('%H:%M:%S') %}
          {{ now_t >= coucher or now_t < reveil }}

      - name: Exercice 18 - Absent
        unique_id: exercice_18_absent
        icon: mdi:home-export-outline
        # Le départ est toujours avant le retour, la même journée.
        state: >-
          {% set depart = states('input_datetime.exercice_18_heure_depart') %}
          {% set retour = states('input_datetime.exercice_18_heure_retour') %}
          {% set now_t = now().strftime('%H:%M:%S') %}
          {{ now_t >= depart and now_t < retour }}

      - name: Exercice 18 - À la maison et réveillé
        unique_id: exercice_18_maison_et_reveille
        icon: mdi:home-account
        state: >-
          {{ not is_state('binary_sensor.exercice_18_endormi', 'on')
             and not is_state('binary_sensor.exercice_18_absent', 'on') }}

lovelace:
  dashboards:
    noel-dashboard:
      mode: yaml
      title: Noël
      icon: mdi:string-lights
      show_in_sidebar: true
      filename: noel.yaml
    exercice-15-dashboard:
      mode: yaml
      title: Exercice 15
      icon: mdi:toggle-switch
      show_in_sidebar: true
      filename: exercice_15.yaml

sensor:
  - platform: mqtt_room
    device_id: "iBeacon:47e89096-9f75-4867-9491-bf896618939c-100-40004"
    name: "Pixel6a Room"
    state_topic: "espresense/devices/iBeacon:47e89096-9f75-4867-9491-bf896618939c-100-40004"
    timeout: 10
    away_timeout: 120
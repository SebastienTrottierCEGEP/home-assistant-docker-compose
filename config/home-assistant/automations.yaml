      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 2
  - trigger: button.pressed
    target:
      entity_id: input_button.exercice_13_2_activer_manuellement_automatisation
    options: {}
  conditions: []
  actions:
  - action: input_number.increment
    metadata: {}
    target:
      entity_id: input_number.exercice_13_recepteur_virtuel
    data: {}
  mode: single
- id: '1789064316933'
  alias: Incrément si temp au-dessus de 10 deg Celsius seulement
  description: ''
  triggers:
  - trigger: switch.turned_on
    target:
      entity_id: input_boolean.exercice_13_capteur_virtuel
    options:
      behavior: each
      for:
        hours: 0
        minutes: 0
        seconds: 2
  - trigger: button.pressed
    target:
      entity_id: input_button.exercice_13_2_activer_manuellement_automatisation
    options: {}
  conditions:
  - condition: temperature.is_value
    target:
      entity_id: sensor.openweathermap_temperature
    options:
      behavior: any
      for: 00:00:00
      threshold:
        type: above
        value:
          active_choice: number
          number: 10
          unit_of_measurement: °C
  actions:
  - action: input_number.increment
    metadata: {}
    target:
      entity_id: input_number.exercice_13_recepteur_virtuel
    data: {}
  mode: single
- id: '1789065847309'

- id: '1789800000001'
  alias: Exercice 15.2 - Activer récepteur et envoyer courriel
  description: Agit sur le récepteur virtuel puis avise par courriel, avec une info
    de capteur obtenue via un modèle.
  triggers:
  - trigger: state
    entity_id: input_button.exercice_15_declencheur_manuel
  conditions: []
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.exercice_15_capteur_virtuel
    data: {}
  - action: notify.send_message
    metadata: {}
    data:
      title: Exercice 15 - Récepteur activé
      message: 'Le récepteur virtuel de l''exercice 15 vient d''être activé. Température
        extérieure actuelle : {{ states(''sensor.openweathermap_temperature'') }}
        °C.'
    target:
      entity_id: notify.s_trottier_home_assistant_s_trottier_locavora_org
  mode: single
- id: '1789800000002'
  alias: Exercice 15.3 - Courriel et écriture dans le journal système
  description: En plus d'envoyer un courriel, écrit la valeur du capteur dans le journal
    système (system_log) au niveau warning.
  triggers:
  - trigger: state
    entity_id: input_boolean.exercice_15_capteur_virtuel
    to: 'on'
  conditions: []
  actions:
  - action: notify.send_message
    metadata: {}
    data:
      title: Exercice 15.3 - Capteur activé
      message: 'Le capteur virtuel de l''exercice 15 est maintenant : {{ states(''input_boolean.exercice_15_capteur_virtuel'')
        }}.'
    target:
      entity_id: notify.s_trottier_home_assistant_s_trottier_locavora_org
  - action: system_log.write
    metadata: {}
    data:
      message: Capteur exercice 15 = {{ states('input_boolean.exercice_15_capteur_virtuel')
        }}
      level: warning
  mode: single
- id: '1789800000003'
  alias: Exercice 15.5 - Envoyer l'adresse IP de l'hôte au démarrage

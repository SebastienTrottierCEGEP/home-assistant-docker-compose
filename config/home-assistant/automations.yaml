- id: examen_pere_noel_en_route
  alias: Examen - Père Noël en route
  description: Met à jour le message lorsque le Père Noël est en route le 24 décembre.
  triggers:
  - trigger: state
    entity_id: input_boolean.pere_noel_dans_ma_maison
  conditions:
  - condition: state
    entity_id: input_boolean.pere_noel_dans_ma_maison
    state: 'off'
  - condition: template
    value_template: '{% set date_examen = as_datetime(states(''input_datetime.date_examen''))
      %} {{ date_examen.month == 12 and date_examen.day == 24 }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.texte_examen
    data:
      value: Le Père Noël est en route!
  mode: single
- id: examen_pere_noel_arrive
  alias: Examen - Père Noël à la maison
  description: Avertit lorsque le Père Noël arrive et que je suis à la maison.
  triggers:
  - trigger: state
    entity_id: input_boolean.pere_noel_dans_ma_maison
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.je_suis_a_la_maison
    state: 'on'
  - condition: template
    value_template: '{% set date_examen = as_datetime(states(''input_datetime.date_examen''))
      %} {{ date_examen.month == 12 and date_examen.day == 24 }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.texte_examen
    data:
      value: Le Père Noël arrive, réveille-toi!
  mode: single
- id: examen_initialiser_date
  alias: Examen - Initialiser la date du jour
  description: Initialise la date virtuelle avec la date actuelle au démarrage.
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.date_examen
    data:
      date: '{{ now().strftime(''%Y-%m-%d'') }}'
  mode: single

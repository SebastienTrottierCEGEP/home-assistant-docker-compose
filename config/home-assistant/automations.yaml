- id: '1789800000004'
  alias: Exercice 15.5 - Entrée journal quotidienne à 10h
  description: Ajoute une entrée dans le journal des activités à 10h tous les jours.
  triggers:
  - trigger: time
    at: '10:00:00'
  conditions: []
  actions:
  - action: logbook.log
    metadata: {}
    data:
      message: Entrée automatique quotidienne de l'exercice 15.5 à 10h.
  mode: single
- id: '1789800000005'
  alias: Exercice 15.6 - Action si capteur activé entre 10h et 12h
  description: N'effectue l'action que si le capteur virtuel est activé entre 10h
    et 12h inclusivement.
  triggers:
  - trigger: state
    entity_id: input_boolean.exercice_15_capteur_virtuel
    to: 'on'
  conditions:
  - condition: time
    after: '10:00:00'
    before: '12:00:01'
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.ex_13_7_lumiere_salon_virtuelle
    data: {}
  mode: single
- id: '1789800000006'
  alias: Exercice 15.7 - Action seulement le samedi et le dimanche
  description: Effectue une action seulement le samedi et le dimanche.
  triggers:
  - trigger: time
    at: 09:00:00
  conditions:
  - condition: time
    weekday:
    - sat
    - sun
  actions:
  - action: logbook.log
    metadata: {}
    data:
      message: Automatisation de fin de semaine exécutée (exercice 15).
  mode: single
